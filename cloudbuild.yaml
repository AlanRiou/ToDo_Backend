# Cloud Build pipeline:
#   1. Maven empaqueta el proyecto Quarkus (genera target/quarkus-app).
#   2. Docker construye la imagen runtime-only con APP_VERSION como build-arg.
#   3. Push a Artifact Registry con tags :<version> y :latest.
#   4. Deploy a Cloud Run usando Cloud SQL, Secret Manager y service account dedicada.
#
# Version precedencia (primero que exista):
#   - $TAG_NAME   (cuando el build lo dispara un git tag)
#   - $SHORT_SHA  (cualquier push a branch)
#   - "dev"       (build local sin git context)
#
# Destino: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}
# Requiere:
#   - Artifact Registry repo: ${_REPOSITORY}
#   - Cloud SQL instance: ${PROJECT_ID}:${_REGION}:${_SQL_INSTANCE}
#   - Secret Manager: db-password y firebase-service-account
#   - Service account runtime: ${_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com

substitutions:
  _REGION: us-central1
  _REPOSITORY: checkly
  _IMAGE: backend
  _SERVICE: checkly-api
  _SQL_INSTANCE: checkly-mysql
  _DB_NAME: checkly
  _DB_USER: checkly_app
  _SERVICE_ACCOUNT: checkly-run
  _DB_PASSWORD_SECRET: db-password
  _FIREBASE_SECRET: firebase-service-account
  _CORS_ORIGINS: "*"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: package
    name: maven:3.9-eclipse-temurin-21
    entrypoint: bash
    args: ['./mvnw', '-B', '-DskipTests', 'package']

  - id: build-and-push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        VERSION="$${TAG_NAME:-$${SHORT_SHA:-dev}}"
        IMAGE_BASE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}"
        echo "Building $$IMAGE_BASE:$$VERSION"
        docker build \
          --build-arg APP_VERSION="$$VERSION" \
          --tag "$$IMAGE_BASE:$$VERSION" \
          --tag "$$IMAGE_BASE:latest" \
          --file=Dockerfile \
          .
        docker push "$$IMAGE_BASE:$$VERSION"
        docker push "$$IMAGE_BASE:latest"

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        VERSION="$${TAG_NAME:-$${SHORT_SHA:-dev}}"
        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:$$VERSION"
        CLOUDSQL_CONNECTION="${PROJECT_ID}:${_REGION}:${_SQL_INSTANCE}"
        DB_JDBC_URL="jdbc:mysql:///${_DB_NAME}?cloudSqlInstance=$$CLOUDSQL_CONNECTION&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false"
        gcloud run deploy ${_SERVICE} \
          --image "$$IMAGE" \
          --region ${_REGION} \
          --platform managed \
          --service-account "${_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com" \
          --add-cloudsql-instances "$$CLOUDSQL_CONNECTION" \
          --set-secrets "DB_PASSWORD=${_DB_PASSWORD_SECRET}:latest,/secrets/firebase-service-account.json=${_FIREBASE_SECRET}:latest" \
          --set-env-vars "DB_KIND=mysql,DB_USERNAME=${_DB_USER},DB_JDBC_URL=$$DB_JDBC_URL,DB_SCHEMA_STRATEGY=validate,DB_MIGRATE_AT_START=true,DB_BASELINE_ON_MIGRATE=true,FIREBASE_SERVICE_ACCOUNT_LOCATION=/secrets/firebase-service-account.json,CORS_ORIGINS=${_CORS_ORIGINS}" \
          --allow-unauthenticated

timeout: 1800s
